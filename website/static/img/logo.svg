<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Robot head background -->
  <rect x="12" y="8" width="40" height="36" rx="8" fill="#2563eb"/>

  <!-- Robot eyes -->
  <circle cx="24" cy="24" r="6" fill="white"/>
  <circle cx="40" cy="24" r="6" fill="white"/>
  <circle cx="24" cy="24" r="3" fill="#1e3a8a"/>
  <circle cx="40" cy="24" r="3" fill="#1e3a8a"/>

  <!-- Robot mouth/speaker -->
  <rect x="20" y="34" width="24" height="4" rx="2" fill="white"/>

  <!-- Robot body -->
  <rect x="18" y="46" width="28" height="14" rx="4" fill="#3b82f6"/>

  <!-- Robot arms -->
  <rect x="6" y="48" width="10" height="4" rx="2" fill="#60a5fa"/>
  <rect x="48" y="48" width="10" height="4" rx="2" fill="#60a5fa"/>

  <!-- Antenna -->
  <line x1="32" y1="8" x2="32" y2="2" stroke="#2563eb" stroke-width="2"/>
  <circle cx="32" cy="2" r="2" fill="#60a5fa"/>
</svg>
