# Deploy Docusaurus to GitHub Pages
#
# Triggers on push to master when book or website content changes.
# Builds the frontend widget, Docusaurus plugin, and static site.

name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'book/**'
      - 'website/**'
      - 'frontend/**'
      - 'docusaurus-plugin/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            website/package-lock.json
            frontend/package-lock.json
            docusaurus-plugin/package-lock.json

      # Build frontend widget
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend widget
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_AUTH_URL: ${{ vars.AUTH_URL }}

      # Build Docusaurus plugin
      - name: Install plugin dependencies
        working-directory: docusaurus-plugin
        run: npm ci

      - name: Build plugin
        working-directory: docusaurus-plugin
        run: npm run build

      # Build Docusaurus site
      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build Docusaurus site
        working-directory: website
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_AUTH_URL: ${{ vars.AUTH_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
